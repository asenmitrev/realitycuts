version: '3.8'

services:
  redis:
    image: redis:7-alpine
    volumes:
      - ./data/redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
        mc mb --ignore-existing local/1703-media-app-2 &&
        mc anonymous set public local/1703-media-app-2 &&
        exit 0
      "

  mongo:
    # mongodb-atlas-local bundles mongod + mongot (MongoDB Search) as a
    # single-node replica set; it replaces plain mongo:7 since search can't
    # be bolted on as a second container without converting mongo:7 to a
    # replica set with keyfile auth for a separate mongot to attach to.
    #
    # These stay on regular Docker-managed volumes (not ./data bind mounts): the
    # replica set's internal auth keyfile under /data/configdb requires real Unix
    # permission bits (0600), which a non-POSIX host filesystem (NTFS/exFAT/network
    # shares) cannot enforce even via chmod, so mongod fails to start with "Unable to
    # acquire security key[s]" if this directory is bind-mounted onto one. Mongo only
    # holds metadata + vector embeddings here (not the actual video files), so its
    # footprint is small — the multi-gigabyte data (MinIO, server /tmp) is what
    # actually needed to move off the OS disk, and those have no such requirement.
    image: mongodb/mongodb-atlas-local:7.0.34
    hostname: mongo
    volumes:
      - videoai-mongo:/data/db
      - videoai-mongo-configdb:/data/configdb
      - videoai-mongo-search:/data/mongot
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-adminpassword}
    ports:
      - "27017:27017"
    # Image ships its own HEALTHCHECK covering mongod + mongot readiness;
    # do not override it here.
    # The image's own PID 1 ("runner") occasionally panics on a slow/flaky mongot
    # liveness ping ("error checking mongot: ... connection refused") and exits — this
    # has been observed on local Docker Desktop even with the container barely using any
    # memory, so it isn't resource pressure. There's no supervisor around PID 1 to retry,
    # so without a restart policy one flaky ping permanently kills the DB until someone
    # notices and runs `docker compose up -d mongo` again.
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: app/server/Dockerfile
    ports:
      - "3021:3021"
    # Real API keys live in app/server/.env; explicit `environment` entries
    # below override anything from this file (hosts/URLs for the compose network).
    env_file:
      - app/server/.env
    volumes:
      - ./app/server/.vertex-key.json:/app/.vertex-key.json:ro
      # Scratch space: library import staging and TTS audio land under /tmp, and
      # the export pipeline writes its intermediate FFmpeg files to /app/data
      # (the cwd-relative ./data inside the image). Bind-mounting both keeps the
      # multi-gigabyte data on this disk/directory instead of Docker's own
      # storage location, which is what actually overloads the OS disk.
      - ./data/server-tmp:/tmp
      - ./data/server-export:/app/data
    extra_hosts:
      # Lets the container reach LLM servers (e.g. LM Studio, local Qwen) bound
      # to the host's localhost via http://host.docker.internal:<port>/v1
      - "host.docker.internal:host-gateway"
    environment:
      - ENVIRONMENT=local
      - PORT=3021
      - MONGODB_URI=${MONGODB_URI:-mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-adminpassword}@mongo:27017/videoai?authSource=admin&directConnection=true}
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=1703-media-app-2
      - MEDIA_BASE_URL=http://localhost:9000
      - CLIENT_URL=http://localhost:3020
      - API_URL=http://localhost:3021
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: app/client/Dockerfile
    ports:
      - "3020:3020"
    depends_on:
      - server

# Redis, MinIO, and the server's scratch space (/tmp and /app/data) are
# bind-mounted under ./data (see the volumes: entries above) so the
# multi-gigabyte data lives on whatever disk this checkout is on, rather than
# under Docker's own storage root (typically /var/lib/docker, usually on the
# OS/home disk). ./data is gitignored.
#
# Mongo's volumes below stay Docker-managed on purpose — see the comment on the mongo
# service.
volumes:
  videoai-mongo:
  videoai-mongo-configdb:
  videoai-mongo-search:
