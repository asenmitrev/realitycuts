version: 0.0
os: linux

files:
  - source: /
    destination: /home/ec2-user/app

file_exists_behavior: OVERWRITE

permissions:
  - object: /home/ec2-user/app
    owner: ec2-user
    group: ec2-user
    mode: 755
    type:
      - directory
  - object: /home/ec2-user/app
    owner: ec2-user
    group: ec2-user
    mode: 644
    type:
      - file

hooks:
  BeforeInstall:
    - location: scripts/codedeploy/before-install.sh
      timeout: 300
      runas: root

  AfterInstall:
    - location: scripts/codedeploy/after-install.sh
      timeout: 300
      runas: ec2-user

  ApplicationStart:
    - location: scripts/codedeploy/application-start.sh
      timeout: 300
      runas: ec2-user

  ValidateService:
    - location: scripts/codedeploy/validate-service.sh
      timeout: 120
      runas: ec2-user
